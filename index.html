    return;
  }
  if (t.dataset && t.dataset.act === 'view-as') { S.as = t.value === 'dono' ? null : t.value; S.view = LAND[role()]; S.folder = null; S.sel = null; render(); return; }
  if (t.dataset && t.dataset.act === 'date-input') { act('date-input', t); return; }
  if (t.dataset && t.dataset.act === 'est-zoom') { const n = nowSP(), x = SECT.find((q) => q.id === estSector()), old = E.zoom; E.zoom = +t.value; const tls = $('#tlscroll'); if (tls) E.scroll = tls.scrollLeft * E.zoom / old; render(); return; }
  if (t.dataset && t.dataset.act === 'limit-set') { const k = t.dataset.k, n = +t.value; W(() => S.db.doc('config/limits').set(Object.assign({}, S.config.limits || {}, { [k]: n }))).then((ok) => { if (ok) toast('Limite atualizado.'); }); return; }
  if (t.dataset && t.dataset.pl != null && PL) { PL.opts[+t.dataset.pl] = t.value; return; }
  if (t.id === 'plMins' && PL) { PL.mins = +t.value; return; }
  if (t.dataset && t.dataset.act === 'role-set') {
    const uid = t.dataset.uid;
    if (t.value === 'ouvinte') W(() => S.db.doc('roles/' + uid).delete());
    else W(() => S.db.doc('roles/' + uid).set({ role: t.value }));
    return;
  }
  if (t.dataset && t.dataset.d) { D[t.dataset.d] = t.value; if (t.dataset.re) render(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('#modal').hidden) { closeModal(); return; }
  estKey(e);
});
window.addEventListener('pagehide', flush);

/* ---------- Relógio da rádio ---------- */
let cjT = 0;
function tick() {
  const prev = curKey;
  AIR = onAir();
  const cur = AIR.cur;
  curKey = cur ? cur.date + cur.sector + cur.id : null;
  syncAudio(AIR);
  ping(); refreshLikes(); refreshPoll();
  if (++cjT % 20 === 5) coverJob();
  if (S.view === 'pedidos') refreshQuota('requests'); else if (S.view === 'sugestoes') refreshQuota('suggestions');
  const pl0 = S.polls.atual;
  if (pl0 && pl0.status === 'open' && Date.now() >= pl0.endsAt && can('programar') && !S.as) closePoll(false);
  if (S.tuned && cur) {
    acc.sec++;
    const st = cur.song.style || 'outros';
    acc.styles[st] = (acc.styles[st] || 0) + 1;
    if (++sinceFlush >= 30) { sinceFlush = 0; flush(); }
  }
  const clk = $('#sideClock');
  if (clk) clk.textContent = hhmmss(AIR.n.sec);
  if (curKey !== prev) { render(); return; }
  if (cur) {
    const pb = $('#progBar'), te = $('#tEl');
    if (pb) pb.style.width = Math.min(100, Math.max(0, (AIR.n.sec - cur.abs) / cur.dur * 100)).toFixed(2) + '%';
    if (te) te.textContent = mmss(AIR.n.sec - cur.abs);
  }
  const ec = $('#estClock');
  if (ec) {
    ec.textContent = hhmmss(AIR.n.sec);
    if (cur) {
      const eb = $('#estBar'), ee = $('#estEl');
      if (eb) eb.style.width = Math.min(100, Math.max(0, (AIR.n.sec - cur.abs) / cur.dur * 100)).toFixed(2) + '%';
      if (ee) ee.textContent = mmss(AIR.n.sec - cur.abs);
    }
    document.querySelectorAll('.ltrack').forEach((tr) => {
      const x = SECT.find((q) => q.id === tr.dataset.lane), l = tr.querySelector('.ph-line');
      if (l && x) l.style.left = ((AIR.n.sec - x.ini * 3600) / 60 * E.zoom).toFixed(1) + 'px';
    });
  }
  const cdn = $('#cdNext');
  if (cdn) { const nx = AIR.list.find((e) => e.song && e.dur > 0 && e.abs > AIR.n.sec); if (nx) cdn.textContent = cdFmt(nx.abs - AIR.n.sec); }
  const nd = $('#needle');
  if (nd) nd.style.left = ((AIR.n.sec - 0) / (24 * 3600) * 100).toFixed(3) + '%';
}

/* ---------- Inicialização ---------- */
function sub(path, key, build, first) {
  S.db.collection(path).onSnapshot((snap) => {
    const o = {};
    snap.docs.forEach((d) => { o[d.id] = build ? build(d) : d.data(); });
    S[key] = o;
    if (first) first();
    scheduleNames();
    scheduleRender();
  }, (e) => console.warn(path, e));
}
async function use(name) { try { return window.claude && window.claude.use ? await window.claude.use(name) : null; } catch (e) { return null; } }

async function boot() {
  try {
    const dr = JSON.parse(sessionStorage.getItem('pc_reg') || 'null');
    if (dr) { D.regNome = dr.nome || ''; D.regTel = dr.tel || ''; sessionStorage.removeItem('pc_reg'); }
  } catch (e) { /* sem armazenamento */ }
  if (window.__staff && /^#(dono|radialista)/.test(location.hash)) { S.rad = { mode: 'login', tel: '' }; S.radDirty = true; }
  AIR = onAir();
  render();
  setInterval(tick, 1000);
  const [db, user, assets] = await Promise.all([use('db'), use('user'), use('assets')]);
  S.db = db; S.user = user; S.assets = assets;
  use('sample').then((x) => { SMP = x; });
  if (user) {
    try {
      S.uid = await user.id();
      S.isOwner = await user.isOwner();
      S.canEdit = await user.canEdit();
      S.canWrite = await user.can('data.write');
      S.me = await user.me();
    } catch (e) { console.warn(e); }
  }
  if (db) {
    const land = () => { if (!S.landed) { S.landed = true; S.view = LAND[role()]; } };
    sub('roles', 'roles', null, () => {
      land();
      if (!S.isOwner && S.reqPriv && !(S.roles[S.uid] && STAFF.includes(S.roles[S.uid].role))) clearKey();
      if (isDono() && !S.peopleSub) { S.peopleSub = true; sub('people', 'people'); }
      restoreKey(); ensureGrants();
    });
    sub('grants', 'grants', null, () => { restoreKey(); ensureGrants(); });
    if (S.canEdit) sub('keys', 'keys', null, () => { S.keysLoaded = true; publishDevKey(); restoreKey(); ensureGrants(); });
    if (S.uid) S.db.doc('keys/' + S.uid).onSnapshot((d) => { S.myKey = d.exists ? d.data() : null; S.keysLoaded = true; publishDevKey(); restoreKey(); }, () => { S.keysLoaded = true; });
    sub('folders', 'folders');
    sub('names', 'names', null, () => { S.namesLoaded = true; land(); });
    if (isDono()) { S.peopleSub = true; sub('people', 'people'); }
    else if (S.uid) S.db.doc('people/' + S.uid).onSnapshot((d) => { S.people = d.exists ? { [S.uid]: d.data() } : {}; scheduleRender(); }, () => {});
    sub('songs', 'songs', (d) => Object.assign({}, d.data(), { id: d.id }));
    sub('plan', 'plan');
    sub('requests', 'requests', null, () => { decryptAll(); });
    sub('suggestions', 'suggestions', null, () => { decryptAll(); });
    sub('templates', 'templates');
    sub('polls', 'polls');
    sub('history', 'history');
    sub('listeners', 'listeners');
    sub('config', 'config', null, () => {
      S.cfgLoaded = true;
      const rk = S.config.reqkeys;
      if (!S.isOwner && S.reqPriv && rk && rk.kid && S.reqKid !== rk.kid) clearKey();
      restoreKey();
      ensureReqKeys();
      ensureGrants();
    });
    if (S.isOwner && S.uid) {
      S.db.doc('data/users/' + S.uid + '/reqkey').onSnapshot((d) => { S.ownerPriv = d.exists ? ((d.data() || {}).priv || null) : null; S.keyLoaded = true; ensureReqKeys(); }, () => { S.keyLoaded = true; });
    }
    setTimeout(() => { land(); scheduleRender(); }, 2500);
    registerVisit();
  } else {
    S.landed = true;
    render();
  }
}
boot();
})();
</script>
